# Пары вопрос–ответ и инструкция–выполнение для SFT
qa:
  - question: "Какие орбитальные элементы определяют наклонение орбиты?"
    answer: "Наклонение орбиты задаётся одним кеплеровым элементом — наклонением (inclination, i). Это угол между плоскостью орбиты и плоскостью экватора Земли (или другой опорной плоскости)."
  - question: "Что такое AOS?"
    answer: "AOS (Acquisition of Signal) — момент установления связи с космическим аппаратом при появлении его над горизонтом наземной станции. После AOS начинается сеанс связи (pass)."
  - question: "Что такое LOS?"
    answer: "LOS (Loss of Signal) — момент потери радиосвязи с КА при уходе его за горизонт станции. Сеанс связи заканчивается в LOS."
  - question: "Что такое eclipse в контексте полёта КА?"
    answer: "Eclipse — период нахождения космического аппарата в тени Земли (или другого небесного тела). В тени солнечные батареи не освещены, питание идёт от батареи; длительность eclipse влияет на тепловой и энергобаланс."
  - question: "Что такое safe mode?"
    answer: "Safe mode (режим сохранения) — штатный режим при аномалии: КА минимизирует потребление, ориентируется на Солнце для питания, отключает некритичные нагрузки и ждёт команд с Земли для диагностики и восстановления."
  - question: "Что такое conjunction в операциях КА?"
    answer: "Conjunction — сближение двух объектов на орбите. При оценке риска столкновения (conjunction assessment) анализируют вероятность столкновения и при необходимости планируют манёвр уклонения (collision avoidance maneuver)."
instructions:
  - instruction: "Перечисли кеплеровы элементы орбиты и что каждый из них означает."
    output: |
      Кеплеровы (классические) элементы орбиты:
      1. a — большая полуось (размер орбиты), м или км.
      2. e — эксцентриситет (форма: 0 — круг, 0–1 — эллипс).
      3. i — наклонение (угол плоскости орбиты к экватору), рад или °.
      4. Ω (RAAN) — долгота восходящего узла, рад или °.
      5. ω — аргумент перицентра, рад или °.
      6. ν — истинная аномалия (положение КА на орбите), рад или °.
  - instruction: "При падении напряжения на шине 28V до 26V что делать?"
    output: |
      Рекомендуемая последовательность:
      1. Зафиксировать телеметрию (напряжение, ток, температура).
      2. Снизить нагрузку на шину (отключить некритичные потребители).
      3. Перевести КА в safe mode при необходимости.
      4. Дождаться следующего сеанса связи (AOS) и передать телеметрию на Землю.
      5. По команде ЦУП выполнить диагностику и при необходимости переключение на резерв.
