# Шаблоны предложений для претренинга (подстановка: {param})
domains:
  orbits:
    - "Орбита КА {name} имеет большую полуось {a_km:.0f} км и наклонение {inc_deg:.1f}°."
    - "Высота в перигее составляет {perigee_km:.0f} км, в апогее — {apogee_km:.0f} км."
    - "Период обращения на орбите равен {period_min:.1f} минут."
    - "Кеплеровы элементы задают орбиту однозначно: большая полуось a, эксцентриситет e, наклонение i, долгота восходящего узла Ω, аргумент перицентра ω, истинная аномалия ν."
  spacecraft:
    - "Подсистема электропитания КА включает солнечные батареи площадью {solar_m2:.1f} м² и аккумулятор ёмкостью {battery_Wh:.0f} Вт·ч."
    - "Номинальное потребление полезной нагрузки — {consumption_W:.0f} Вт."
    - "Оставшийся запас характеристической скорости (Δv) составляет {delta_v:.0f} м/с."
    - "Уровень заряда батареи (SoC) на момент {time_utc} — {soc_percent:.0f}%."
  procedures:
    - "При входе в тень (eclipse) рекомендуется снизить потребление до минимума для сохранения заряда."
    - "В режиме safe mode КА ориентируется на Солнце и отключает некритичные нагрузки."
    - "Процедура при падении напряжения: зафиксировать телеметрию, перейти в safe mode, дождаться AOS следующего сеанса."
  missions:
    - "Миссия {name} — спутник ДЗЗ в LEO с целевой высотой {alt_km:.0f} км."
    - "Цель миссии: выполнить не менее {imaging_count} съёмок и {comms_sessions} сеансов связи за сутки."
    - "Ограничение по Δv на операционный период: {delta_v_budget:.0f} м/с."
