[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "space-env"
version = "0.134.0"
description = "Environment for generating pretraining/SFT/RL data for space industry agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "boinor>=0.18",
    "gymnasium>=0.29",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
marl = ["pettingzoo>=1.24"]
reference = ["scipy>=1.10", "pyerfa>=2.0"]
coverage = ["shapely>=2.0", "pyproj>=3.6"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sgp4>=2.20",
    "nrlmsise00>=0.1.0",
]
# Отраслевые библиотеки (см. docs/INDUSTRY_LIBRARIES.md)
sgp4 = ["sgp4>=2.20"]           # TLE/SGP4 — CelesTrak, Space-Track, NORAD
astropy = ["astropy>=6.0"]      # Время, единицы, координаты
spice = ["spiceypy>=4.0"]      # NASA SPICE — эфемериды, навигация
ccsds = ["ccsdspy>=2.0", "spacepackets>=0.22"]  # CCSDS/ECSS — телеметрия и команды
orekit = ["orekit-jpype>=13.0"] # OreKit — орбиты, время, пропагация (требует JDK 11+ или pip install ".[orekit-jdk]")
orekit-jdk = ["orekit-jpype[jdk4py]>=13.0"]  # OreKit с подтягиванием JDK через jdk4py
msis = ["nrlmsise00>=0.1.0"]  # NRLMSISE-00, плотность по F10.7 и Ap
# pykep (ESA, GPL-3) — см. docs, ставится отдельно
all-industry = [
    "sgp4>=2.20",
    "astropy>=6.0",
    "spiceypy>=4.0",
    "ccsdspy>=2.0",
    "spacepackets>=0.22",
    "orekit-jpype>=13.0",
]

[project.entry-points."gymnasium.envs"]
space_env = "space_env.envs"

[project.scripts]
space-env = "space_env.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/space_env"]

[tool.hatch.build.targets.wheel.force-include]
"viz/operator.html" = "space_env/studio_assets/operator.html"
"viz/operator.js" = "space_env/studio_assets/operator.js"
"viz/operator.css" = "space_env/studio_assets/operator.css"
"viz/workspace.js" = "space_env/studio_assets/workspace.js"
"viz/workspace.css" = "space_env/studio_assets/workspace.css"
"viz/studio.html" = "space_env/studio_assets/studio.html"
"viz/studio.js" = "space_env/studio_assets/studio.js"
"viz/app.js" = "space_env/studio_assets/app.js"
"viz/index.html" = "space_env/studio_assets/index.html"
"viz/vendor" = "space_env/studio_assets/vendor"
"viz/textures" = "space_env/studio_assets/textures"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
