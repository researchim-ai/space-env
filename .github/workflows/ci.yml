name: tests

on:
  pull_request:

jobs:
  profile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            profile: fast
          - python-version: "3.11"
            profile: fast
          - python-version: "3.12"
            profile: fast
          - python-version: "3.12"
            profile: reference
          - python-version: "3.12"
            profile: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: pip install -e ".[dev]"
      - name: Run profile
        run: python -m space_env.eval.ci_profiles ${{ matrix.profile }}
