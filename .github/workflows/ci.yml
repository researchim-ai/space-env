name: tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            profile: fast
          - python-version: "3.11"
            profile: fast
          - python-version: "3.12"
            profile: fast
          - python-version: "3.12"
            profile: reference
          - python-version: "3.12"
            profile: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: pip install -e ".[dev,reference]"
      - name: Run profile
        run: python -m space_env.eval.ci_profiles ${{ matrix.profile }}

  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install in a clean environment
        run: |
          python -m venv /tmp/space-env-wheel-check
          /tmp/space-env-wheel-check/bin/python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheels[0] + '[reference]'])"
      - name: Verify outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/scripts/verify_installed.py" --expected-prefix /tmp/space-env-wheel-check
