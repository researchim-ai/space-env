name: tests

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

jobs:
  retained-mission-plan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install retained-plan wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/retained-plan-ci-venv
          /tmp/retained-plan-ci-venv/bin/python -c "import glob,subprocess,sys; w=glob.glob('dist/*.whl'); assert len(w)==1; subprocess.check_call([sys.executable,'-m','pip','install',w[0]+'[reference]'])"
      - name: Retain positive mission plan and independently audit native dataset
        working-directory: /tmp
        run: /tmp/retained-plan-ci-venv/bin/python -I "$GITHUB_WORKSPACE/examples/planning/mission_bundle.py" /tmp/retained-plan-ci-positive --native-audit
      - name: Retain infeasible service control as RL with no SFT promotion
        if: success() || failure()
        working-directory: /tmp
        run: /tmp/retained-plan-ci-venv/bin/python -I "$GITHUB_WORKSPACE/examples/planning/mission_bundle.py" /tmp/retained-plan-ci-negative --negative --native-audit
      - name: Retain two-orbit mission plan, continuation, native replay and RL/SFT
        if: success() || failure()
        working-directory: /tmp
        run: /tmp/retained-plan-ci-venv/bin/python -I "$GITHUB_WORKSPACE/examples/planning/mission_bundle.py" /tmp/retained-plan-ci-full --full-orbit
      - name: Preserve candidate, failed outcomes, checkpoints and datasets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-mission-plan-evidence
          if-no-files-found: warn
          path: |
            /tmp/retained-plan-ci-positive/
            /tmp/retained-plan-ci-negative/
            /tmp/retained-plan-ci-full/
            dist/*.whl

  full-orbit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install full-orbit wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/full-orbit-ci-venv
          /tmp/full-orbit-ci-venv/bin/python -c "import glob,subprocess,sys; w=glob.glob('dist/*.whl'); assert len(w)==1; subprocess.check_call([sys.executable,'-m','pip','install',w[0]+'[reference]'])"
      - name: Check dense balanced-coast program
        working-directory: /tmp
        run: /tmp/full-orbit-ci-venv/bin/python -I "$GITHUB_WORKSPACE/examples/validation/balanced_coast.py" /tmp/full-orbit-ci-coast.json
      - name: Freeze full-orbit specification and diagnostic
        working-directory: /tmp
        run: |
          /tmp/full-orbit-ci-venv/bin/python -I "$GITHUB_WORKSPACE/examples/coupled/full_orbit.py" /tmp/full-orbit-ci-spec.json --write-spec
          /tmp/full-orbit-ci-venv/bin/python -I -m space_env.cli compile-full-orbit /tmp/full-orbit-ci-spec.json /tmp/full-orbit-ci-workload.json
          /tmp/full-orbit-ci-venv/bin/python -I "$GITHUB_WORKSPACE/examples/coupled/full_orbit.py" /tmp/full-orbit-ci-geometry.json --geometry-only
      - name: Execute two-orbit nominal and outage direct-restored pairs
        working-directory: /tmp
        run: |
          /tmp/full-orbit-ci-venv/bin/python -I - <<'PY'
          import importlib.util,json,os
          from space_env.scaling.benchmark import run_scale
          spec=importlib.util.spec_from_file_location('full_orbit_recipe',os.environ['GITHUB_WORKSPACE']+'/examples/coupled/full_orbit.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          frozen=json.load(open('/tmp/full-orbit-ci-spec.json'))
          result=run_scale(module.manifest(frozen)|{'workers':2},'/tmp/full-orbit-ci-campaign')
          raise SystemExit(0 if result['ok'] else 1)
          PY
      - name: Preserve every full-orbit attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-orbit-evidence
          if-no-files-found: warn
          path: |
            /tmp/full-orbit-ci-*.json
            /tmp/full-orbit-ci-campaign/
            dist/*.whl

  coupled-actuators:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install isolated actuator verification wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m venv /tmp/actuator-ci-venv
          /tmp/actuator-ci-venv/bin/python -c "import glob, subprocess, sys; w=glob.glob('dist/*.whl'); assert len(w)==1; subprocess.check_call([sys.executable,'-m','pip','install',w[0]+'[reference]'])"
      - name: Freeze verification inputs outside checkout
        working-directory: /tmp
        run: |
          /tmp/actuator-ci-venv/bin/python -I "$GITHUB_WORKSPACE/examples/coupled/study.py" /tmp/actuator-ci-study.json --write-spec --fixed-clock
          /tmp/actuator-ci-venv/bin/python -I -c "import json,pathlib; c=json.load(open('/tmp/actuator-ci-study.json')); pathlib.Path('/tmp/actuator-ci-config.json').write_text(json.dumps(c['development']))"
      - name: Verify all 18 actuator mesh and partition cases
        working-directory: /tmp
        run: /tmp/actuator-ci-venv/bin/python -I -m space_env.cli qualify-coupled-actuators /tmp/actuator-ci-config.json /tmp/actuator-ci-matrix
      - name: Audit retained actuator evidence
        if: always()
        working-directory: /tmp
        run: /tmp/actuator-ci-venv/bin/python -I -m space_env.cli verify-coupled-actuators /tmp/actuator-ci-matrix
      - name: Verify fresh-process mid-firing and joint RCS recovery
        if: success() || failure()
        working-directory: /tmp
        run: /tmp/actuator-ci-venv/bin/python -I "$GITHUB_WORKSPACE/examples/coupled/actuator_resume.py" /tmp/actuator-ci-study.json /tmp/actuator-ci-resume
      - name: Verify 600-second positive-service and outage regression
        if: success() || failure()
        working-directory: /tmp
        run: /tmp/actuator-ci-venv/bin/python -I "$GITHUB_WORKSPACE/examples/coupled/extended.py" /tmp/actuator-ci-study.json /tmp/actuator-ci-extended
      - name: Retain all actuator attempts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coupled-actuator-evidence
          if-no-files-found: warn
          path: |
            /tmp/actuator-ci-*.json
            /tmp/actuator-ci-matrix/
            /tmp/actuator-ci-resume/
            /tmp/actuator-ci-extended/
            dist/*.whl

  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            profile: fast
          - python-version: "3.11"
            profile: fast
          - python-version: "3.12"
            profile: fast
          - python-version: "3.12"
            profile: reference
          - python-version: "3.12"
            profile: full
            arguments: "--shard other"
          - python-version: "3.12"
            profile: full
            arguments: "--shard campaign"
          - python-version: "3.12"
            profile: full
            arguments: "--shard tasking-base"
          - python-version: "3.12"
            profile: full
            arguments: "--shard tasking-sixteen"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test tools
        run: pip install -e ".[dev,reference,coverage,marl]"
      - name: Run profile
        run: python -m space_env.eval.ci_profiles ${{ matrix.profile }} ${{ matrix.arguments }}

  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install in a clean environment
        run: |
          python -m venv /tmp/space-env-wheel-check
          /tmp/space-env-wheel-check/bin/python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheels[0] + '[reference,coverage,marl]'])"
      - name: Verify outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/scripts/verify_installed.py" --expected-prefix /tmp/space-env-wheel-check
      - name: Verify analytical physics envelopes outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/validation/envelopes.py" /tmp/space-env-physics-envelopes.json --long --external
      - name: Verify off-axis dynamics and fixed-station contacts outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/validation/pointing.py" /tmp/space-env-pointing.json
      - name: Verify evidence and mixed-component ensembles outside checkout
        working-directory: /tmp
        run: |
          /tmp/space-env-wheel-check/bin/space-env calibration-check /tmp/space-env-calibration.json
          /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/calibration/demo.py" /tmp/space-env-calibration-native
      - name: Verify material enthalpy and native domain rollback outside checkout
        working-directory: /tmp
        run: |
          /tmp/space-env-wheel-check/bin/space-env reference-qualify-materials /tmp/space-env-materials.json
          /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/materials/demo.py" /tmp/space-env-materials-native
      - name: Verify complete parameter ensemble execution outside checkout
        working-directory: /tmp
        run: |
          /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/calibration/qualification.py" /tmp/space-env-ensemble-native --new-process
          /tmp/space-env-wheel-check/bin/space-env verify-ensemble /tmp/space-env-ensemble-native
      - name: Verify independent fixed-site multi-plane deliveries outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/scaling/independent.py" /tmp/space-env-independent-native --small
      - name: Verify bounded factory outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/factory/demo.py" /tmp/space-env-factory-check
      - name: Verify coupled multi-plane missions and process restoration outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/coupled/demo.py" /tmp/space-env-coupled-check
      - name: Verify frozen mission refinement and unseen geometry study
        if: github.event_name != 'pull_request'
        working-directory: /tmp
        run: |
          /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/coupled/study.py" /tmp/space-env-study-spec.json --write-spec
          /tmp/space-env-wheel-check/bin/python -I -m space_env.cli mission-study /tmp/space-env-study-spec.json /tmp/space-env-mission-study
          /tmp/space-env-wheel-check/bin/python -I -m space_env.cli verify-mission-study /tmp/space-env-mission-study
      - name: Verify fixed-tick clocks and mid-tick process restoration
        if: github.event_name != 'pull_request'
        working-directory: /tmp
        run: |
          /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/coupled/study.py" /tmp/space-env-fixed-clock-spec.json --write-spec --fixed-clock
          /tmp/space-env-wheel-check/bin/python -I -m space_env.cli mission-study /tmp/space-env-fixed-clock-spec.json /tmp/space-env-fixed-clock-study
          /tmp/space-env-wheel-check/bin/python -I -m space_env.cli verify-mission-study /tmp/space-env-fixed-clock-study
          /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/coupled/clock_resume.py" /tmp/space-env-fixed-clock-spec.json /tmp/space-env-fixed-clock-restart
          /tmp/space-env-wheel-check/bin/python -I - <<'PY'
          import json
          from pathlib import Path
          from space_env.scaling.coupled import coupled_workload
          from space_env.simulation.snapshot import canonical_json
          c = json.load(open('/tmp/space-env-fixed-clock-spec.json'))['development']
          Path('/tmp/space-env-fixed-clock-scenario.json').write_text(canonical_json(coupled_workload(c)['scenario']))
          PY
          /tmp/space-env-wheel-check/bin/python -I -m space_env.cli qualify-controller-clock /tmp/space-env-fixed-clock-scenario.json /tmp/space-env-fixed-clock-program
      - name: Verify isolated scale smoke outside checkout
        working-directory: /tmp
        run: |
          /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/scaling/demo.py" /tmp/space-env-scale.json
          /tmp/space-env-wheel-check/bin/space-env scale-benchmark /tmp/space-env-scale.json /tmp/space-env-scale-check
      - name: Verify distinct-orbit fleet outside checkout
        working-directory: /tmp
        run: |
          /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/scaling/fleet.py" /tmp/space-env-fleet.json --actors 4 --products 12 --planes 2
          /tmp/space-env-wheel-check/bin/space-env scale-benchmark /tmp/space-env-fleet.json /tmp/space-env-fleet-check
      - name: Verify replay-once multi-format export outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/scaling/verified_export.py" /tmp/space-env-verified-export
      - name: Verify native operator outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/operator/smoke.py"
      - name: Verify durable operator restart and handover outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/operator/durable_smoke.py"
      - name: Verify operator cursor and online backup outside checkout
        working-directory: /tmp
        run: |
          /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/operator/maintenance_smoke.py"
          /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/operator/maintenance_http_smoke.py"

      - name: Verify bounded artifact transport outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/operator/artifact_smoke.py"

      - name: Verify paired coupled campaign outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/campaign/installed_smoke.py"

      - name: Verify ground windows and observed ACK cancellation outside checkout
        working-directory: /tmp
        run: /tmp/space-env-wheel-check/bin/python -I "$GITHUB_WORKSPACE/examples/campaign/ground_smoke.py"
